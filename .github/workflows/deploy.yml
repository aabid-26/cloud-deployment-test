name: CI/CD Pipeline

# This tells GitHub to run the script every time you "push" to the main branch
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the latest code from your GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Log in to your Docker Hub account using the secrets you saved
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the image for the AWS server (Intel/AMD architecture) and push it to Docker Hub
      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/devops-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-api:latest

      # 4. Log in to your AWS server using SSH and restart the app
      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_KEY }}
          script: |
            # Pull the new image from Docker Hub onto the AWS server
            docker pull ${{ secrets.DOCKER_USERNAME }}/devops-api:latest
            # Stop the old version if it's already running
            docker stop devops-api || true
            # Remove the old container
            docker rm devops-api || true
            # Run the new version on port 8000
            docker run -d --name devops-api -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/devops-api:latest
